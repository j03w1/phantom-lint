name: Phantom-Lint Security CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  verify-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Unit Test Suite
        run: python3 -m unittest test_phantom_lint.py -v

      - name: Run Self-Audit Scan on Repository
        run: python3 phantom_lint.py .